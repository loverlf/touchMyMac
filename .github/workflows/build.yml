name: Build TouchMyMac (Intel)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15          # arm64 runner，交叉编译 x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Build
        run: |
          xcodebuild \
            -project TouchMyMac.xcodeproj \
            -scheme TouchMyMac \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath build \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Check arch
        run: |
          APP="build/Build/Products/Release/TouchMyMac.app"
          lipo -archs "$APP/Contents/MacOS/TouchMyMac"

      - name: Ad-hoc sign
        run: |
          APP="build/Build/Products/Release/TouchMyMac.app"
          codesign --force --deep --sign - "$APP"
          codesign -dv "$APP" || true

      - name: Package
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent TouchMyMac.app TouchMyMac-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TouchMyMac-x86_64
          path: build/Build/Products/Release/TouchMyMac-x86_64.zip
